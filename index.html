<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef0f5" media="(prefers-color-scheme: light)">
<title>Максим Витков — цифровая визитка</title>
<style>
  :root {
    --bg: #eef0f5;
    --card: rgba(255,255,255,.75);
    --card-border: rgba(255,255,255,.9);
    --text: #1a1a22;
    --text2: #6b7280;
    --btn-bg: rgba(255,255,255,.65);
    --btn-hover: rgba(255,255,255,.95);
    --btn-border: rgba(26,26,34,.07);

    /* Палитра: Синий -> Голубой -> Бирюзовый */
    --accent1: #2563eb;
    --accent2: #0ea5e9;
    --accent3: #14b8a6;
    --shadow: 0 8px 32px rgba(14,165,233,.10);
    --glow: rgba(14,165,233,.25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b10;
      --card: rgba(24,24,32,.72);
      --card-border: rgba(255,255,255,.08);
      --text: #f3f4f8;
      --text2: #9aa0ad;
      --btn-bg: rgba(255,255,255,.045);
      --btn-hover: rgba(255,255,255,.09);
      --btn-border: rgba(255,255,255,.07);

      /* Темная тема: Светло-синий -> Циан -> Изумрудный */
      --accent1: #3b82f6;
      --accent2: #22d3ee;
      --accent3: #34d399;
      --shadow: 0 8px 32px rgba(0,0,0,.45);
      --glow: rgba(34,211,238,.35);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* Фоновые пятна */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 360px; height: 360px;
    top: -120px; left: -100px;
    background: radial-gradient(circle, var(--accent2), transparent 65%);
    opacity: .35;
  }
  body::after {
    width: 320px; height: 320px;
    bottom: -100px; right: -80px;
    background: radial-gradient(circle, var(--accent3), transparent 65%);
    opacity: .22;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 410px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 24px 18px 20px;
  }

  /* Аватар с градиентным кольцом */
  .avatar-wrap {
    position: relative;
    width: 86px; height: 86px;
    margin: 0 auto 12px;
  }
  .avatar-wrap::before {
    content: '';
    position: absolute; inset: -3px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3));
    animation: spin 6s linear infinite;
  }
  .avatar-wrap::after {
    content: '';
    position: absolute; inset: -12px;
    border-radius: 50%;
    background: var(--glow);
    filter: blur(18px);
    z-index: -1;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .avatar {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: linear-gradient(160deg, #0f172a, #020617);
    border: 3px solid transparent;
    background-clip: padding-box;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; letter-spacing: .02em;
  }

  h1 {
    font-size: 24px;
    text-align: center;
    font-weight: 800;
    letter-spacing: -.02em;
    background: linear-gradient(120deg, var(--text) 40%, var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    text-align: center;
    color: var(--text2);
    font-size: 13px;
    margin: 4px 0 18px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .pulse {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 0 0 rgba(52,211,153,.5);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(52,211,153,.45); }
    70% { box-shadow: 0 0 0 8px rgba(52,211,153,0); }
    100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
  }

  /* Главная кнопка (в едином стиле с остальными) */
  .btn.primary {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 18px;
    color: var(--text);
    font-weight: 600;
    font-size: 14.5px;
    padding: 11px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .btn.primary:hover {
    background: var(--btn-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,.08);
  }
  .btn.primary:active { transform: translateY(0) scale(.98); }
  .btn.primary .icon {
    width: 38px; height: 38px; flex: 0 0 38px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,.15);
    transition: transform .18s ease;
  }
  .btn.primary:hover .icon { transform: scale(1.08) rotate(-4deg); }
  .btn.primary .icon svg { width: 20px; height: 20px; fill: currentColor; }
  .btn.primary small { display: block; color: var(--text2); font-size: 11.5px; margin-top: 1px; font-weight: 400; }

  /* Сетка плиток */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 12px 6px 10px;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 18px;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    text-align: center;
    font-family: inherit;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .tile:hover { background: var(--btn-hover); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
  .tile:active { transform: translateY(0) scale(.97); }
  .tile .icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,.15);
    transition: transform .18s ease;
  }
  .tile:hover .icon { transform: scale(1.1) rotate(-4deg); }
  .tile .icon svg { width: 20px; height: 20px; fill: currentColor; }
  .tile span:last-child { line-height: 1.2; }

  /* Фирменные цвета иконок */
  .ic-call   { background: linear-gradient(135deg, #34d399, #059669); }
  .ic-mail   { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
  .ic-tg     { background: linear-gradient(135deg, #38bdf8, #229ed9); }
  .ic-wa     { background: linear-gradient(135deg, #4ade80, #22c55e); }
  .ic-money  { background: linear-gradient(135deg, #fb923c, #ea580c); }
  .ic-geo    { background: linear-gradient(135deg, #f87171, #ef4444); }
  .ic-home   { background: linear-gradient(135deg, #818cf8, #4f46e5); }

  /* Кнопка на всю ширину */
  .btn.wide {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 11px 14px;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 18px;
    color: var(--text);
    font-size: 14.5px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .btn.wide:hover { background: var(--btn-hover); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
  .btn.wide:active { transform: translateY(0) scale(.98); }
  .btn.wide .icon {
    width: 38px; height: 38px; flex: 0 0 38px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,.15);
    transition: transform .18s ease;
  }
  .btn.wide:hover .icon { transform: scale(1.08) rotate(-4deg); }
  .btn.wide .icon svg { width: 20px; height: 20px; fill: currentColor; }
  .btn.wide small { display: block; color: var(--text2); font-size: 11.5px; margin-top: 1px; font-weight: 400; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 20px;
    transform: translateX(-50%) translateY(90px);
    background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 12px;
    font-size: 13.5px; font-weight: 500;
    opacity: 0;
    transition: all .3s cubic-bezier(.2,.9,.3,1.3);
    pointer-events: none;
    max-width: 88vw; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Появление элементов */
  .fade-up { animation: fadeUp .55s ease backwards; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .12s; }
  .d3 { animation-delay: .19s; } .d4 { animation-delay: .26s; }
  .d5 { animation-delay: .33s; } .d6 { animation-delay: .40s; }
  .d7 { animation-delay: .47s; } .d8 { animation-delay: .54s; }
</style>
</head>
<body>

<div class="card">
  <div class="avatar-wrap fade-up d1">
    <div class="avatar">МВ</div>
  </div>
  <h1 class="fade-up d2">Максим Витков</h1>
  <p class="subtitle fade-up d3"><span class="pulse"></span>Цифровая визитка · NFC-карта</p>

  <button class="btn primary fade-up d4" onclick="downloadVCard()">
    <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 12c4.42 0 8 2.24 8 5v3H4v-3c0-2.76 3.58-5 8-5Z"/></svg></span>
    <span>Добавить в контакты<small>Имя, фамилия, телефон, почта</small></span>
  </button>

  <div class="grid">
    <a class="tile fade-up d5" href="tel:+37378407287">
      <span class="icon ic-call"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.36 11.36 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.36 11.36 0 0 0 .57 3.57 1 1 0 0 1-.25 1.02Z"/></svg></span>
      <span>Позвонить</span>
    </a>

    <a class="tile fade-up d5" href="mailto:vitm36844@gmail.com">
      <span class="icon ic-mail"><svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5Z"/></svg></span>
      <span>Почта</span>
    </a>

    <a class="tile fade-up d6" href="https://t.me/Vitk0V" target="_blank" rel="noopener">
      <span class="icon ic-tg"><svg viewBox="0 0 24 24"><path d="M21.9 4.6 18.8 19c-.2 1-.8 1.2-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-1 .5l.3-4.6L18 6.9c.4-.3-.1-.5-.6-.2L7.2 13.2 2.7 11.8c-1-.3-1-1 .2-1.4l18-7c.8-.3 1.5.2 1 1.2Z"/></svg></span>
      <span>Telegram</span>
    </a>

    <a class="tile fade-up d6" href="https://wa.me/37378407287" target="_blank" rel="noopener">
      <span class="icon ic-wa"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.4 14.1c-.2.7-1.3 1.3-1.9 1.3-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5.1-4.5-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.4.7-.4h.5c.2 0 .4 0 .6.5s.7 1.8.8 1.9c.1.1.1.3 0 .5l-.4.6c-.2.2-.4.4-.2.8.2.4 1 1.6 2.1 2.6 1.4 1.3 2.6 1.7 3 1.8.4.2.6.1.8-.1l.9-1.1c.2-.3.4-.2.7-.1l1.8.9c.3.1.5.2.5.4 0 0 .1.6-.2 1.3Z"/></svg></span>
      <span>WhatsApp</span>
    </a>

    <a class="tile fade-up d7" href="https://mia-qr.bnm.md/1/m/BNM/AGRbcfca880b0184d258a83a8d54f41d606" target="_blank" rel="noopener">
      <span class="icon ic-money"><svg viewBox="0 0 24 24"><path d="M12 2 2 7v2h20V7Zm-10 9v8H2v3h20v-3h-2v-8Zm4 0h4v4H6Zm6 0h4v8h-4ZM4 13v6h2v-6Zm0 0"/></svg></span>
      <span>Перевести деньги</span>
    </a>

    <button class="tile fade-up d7" onclick="shareFoundLocation()">
      <span class="icon ic-geo"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg></span>
      <span>Карта найдена<br>здесь</span>
    </button>
  </div>

  <a class="btn wide fade-up d8" href="https://www.google.com/maps/search/?api=1&query=Strada+Maria+Dr%C4%83gan+22%2F1%2C+Chi%C8%99in%C4%83u" target="_blank" rel="noopener">
    <span class="icon ic-home"><svg viewBox="0 0 24 24"><path d="m12 3 9 8h-3v9h-4v-6h-4v6H6v-9H3Z"/></svg></span>
    <span>Вернуть карточку владельцу<small>Strada Maria Drăgan 22/1, Chișinău</small></span>
  </a>
</div>

<div class="toast" id="toast"></div>

<script>
  // ---------- vCard ----------
  function downloadVCard() {
    const vcf = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:Vitkov;Maxim;;;',
      'FN:Максим Витков',
      'TEL;TYPE=CELL:+37378407287',
      'EMAIL:vitm36844@gmail.com',
      'END:VCARD'
    ].join('\r\n');
    const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Maxim-Vitkov.vcf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Файл контакта сохранён — откройте его, чтобы добавить в контакты');
  }

  // ---------- Геолокация: отправка координат на почту ----------
  function shareFoundLocation() {
    if (!navigator.geolocation) {
      showToast('Геолокация не поддерживается на этом устройстве');
      return;
    }
    showToast('Определяем местоположение…');
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        const mapsUrl = 'https://www.google.com/maps?q=' + latitude + ',' + longitude;
        const text = 'Вашу NFC-карту отсканировали!\n' +
                     'Координаты: ' + latitude + ', ' + longitude +
                     ' (точность ~' + Math.round(accuracy) + ' м)\n' +
                     'На карте: ' + mapsUrl + '\n' +
                     'Время: ' + new Date().toLocaleString();
        try {
          const res = await fetch('https://formsubmit.co/ajax/23ba987e96aeb96429b2c061ad8e86ef', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              _subject: '📍 NFC-карта найдена!',
              _template: 'table',
              _captcha: 'false',
              message: text
            })
          });
          if (!res.ok) throw new Error();
          showToast('✅ Отправлено! Максим получил местоположение');
        } catch (e) {
          if (navigator.share) {
            navigator.share({ title: 'Карта найдена здесь', text: 'Отправьте это Максиму:', url: mapsUrl }).catch(() => {});
          } else {
            window.open(mapsUrl, '_blank');
          }
        }
      },
      () => showToast('Не удалось получить геолокацию — проверьте разрешения'),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // ---------- Toast ----------
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
  }
</script>

</body>
</html>
