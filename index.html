<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Максим Витков — цифровая визитка</title>

<style>
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --text: #1c1c1e;
  --muted: #6c6c70;
  --line: rgba(60, 60, 67, .18);
  --blue: #007aff;
  --green: #34c759;
  --orange: #ff9f0a;
  --red: #ff3b30;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000;
    --card: #1c1c1e;
    --text: #fff;
    --muted: #98989d;
    --line: rgba(255, 255, 255, .15);
    --blue: #0a84ff;
    --green: #30d158;
    --red: #ff453a;
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body {
  display: grid;
  place-items: center;
  padding:
    max(10px, env(safe-area-inset-top))
    12px
    max(10px, env(safe-area-inset-bottom));
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

.card {
  width: min(100%, 430px);
  height: min(790px, calc(100dvh - 20px));
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 18px 12px 12px;
  border: 1px solid var(--line);
  border-radius: 28px;
  background: rgba(255, 255, 255, .76);
  box-shadow: 0 14px 40px rgba(0, 0, 0, .10);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
}
@media (prefers-color-scheme: dark) {
  .card {
    background: rgba(28, 28, 30, .88);
    box-shadow: 0 14px 40px rgba(0, 0, 0, .40);
  }
}

.profile {
  flex: 0 0 auto;
  padding: 0 10px 15px;
  text-align: center;
}
.avatar {
  width: clamp(62px, 9.5vh, 82px);
  height: clamp(62px, 9.5vh, 82px);
  display: grid;
  place-items: center;
  margin: 0 auto 10px;
  border: 3px solid rgba(255,255,255,.9);
  border-radius: 50%;
  color: #fff;
  background: linear-gradient(145deg, #4a4a4f, #1c1c1e);
  box-shadow: 0 6px 16px rgba(0,0,0,.2);
  font-size: clamp(23px, 3.4vh, 29px);
  font-weight: 700;
  letter-spacing: -.08em;
}
h1 {
  font-size: clamp(24px, 3.5vh, 29px);
  line-height: 1.08;
  font-weight: 700;
  letter-spacing: -.045em;
}
.subtitle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 7px;
  color: var(--muted);
  font-size: clamp(12px, 1.8vh, 14px);
}
.online {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(52,199,89,.15);
}

.section-title {
  flex: 0 0 auto;
  margin: 0 10px 6px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .02em;
  text-transform: uppercase;
}
.list {
  flex: 0 0 auto;
  overflow: hidden;
  margin-bottom: 9px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--card);
}
.row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: clamp(54px, 7.5vh, 64px);
  padding: 8px 12px;
  border: 0;
  color: var(--text);
  background: transparent;
  font: inherit;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: transform .18s cubic-bezier(.2,.8,.2,1), background .15s ease;
}
.row + .row::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  left: 60px;
  height: 1px;
  background: var(--line);
}
.row:active, .action:active {
  transform: scale(.97);
  background: rgba(120,120,128,.13);
}

.icon {
  width: clamp(34px, 5.5vh, 40px);
  height: clamp(34px, 5.5vh, 40px);
  flex: 0 0 clamp(34px, 5.5vh, 40px);
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
}
.icon svg {
  width: 21px;
  height: 21px;
  fill: currentColor;
}
.i-contact { background: var(--blue); }
.i-home { background: #8e8e93; }
.i-phone { background: var(--green); }
.i-mail { background: var(--orange); }
.i-telegram { background: #229ed9; }
.i-whatsapp { background: #25d366; }
.i-money { background: #ff6b37; }
.i-location { background: var(--red); }

.row-copy {
  min-width: 0;
  flex: 1;
}
.row-copy strong {
  display: block;
  font-size: clamp(14px, 2.1vh, 16px);
  font-weight: 500;
}
.row-copy small {
  display: block;
  overflow: hidden;
  margin-top: 2px;
  color: var(--muted);
  font-size: clamp(11px, 1.65vh, 12.5px);
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chevron {
  width: 8px;
  height: 8px;
  margin-right: 4px;
  border-top: 1.5px solid var(--muted);
  border-right: 1.5px solid var(--muted);
  transform: rotate(45deg);
}

.grid {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 8px;
  min-height: 0;
}
.action {
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(5px, 1vh, 9px);
  padding: 7px 6px;
  border: 1px solid var(--line);
  border-radius: 17px;
  color: var(--text);
  background: var(--card);
  font: inherit;
  font-size: clamp(12px, 1.9vh, 14px);
  font-weight: 500;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transition: transform .22s cubic-bezier(.2,.8,.2,1);
}
.action:hover {
  box-shadow: 0 7px 16px rgba(0,0,0,.09);
}

.toast {
  position: fixed;
  z-index: 5;
  bottom: max(18px, env(safe-area-inset-bottom));
  left: 50%;
  max-width: calc(100vw - 32px);
  padding: 11px 15px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 14px;
  color: #fff;
  background: rgba(28,28,30,.94);
  box-shadow: 0 10px 32px rgba(0,0,0,.25);
  font-size: 13px;
  text-align: center;
  opacity: 0;
  transform: translate(-50%,16px) scale(.96);
  pointer-events: none;
  transition: opacity .25s ease, transform .42s cubic-bezier(.16,1,.3,1);
}
.toast.show {
  opacity: 1;
  transform: translate(-50%,0) scale(1);
}

.reveal {
  animation: reveal .55s cubic-bezier(.16,1,.3,1) both;
}
.r1 { animation-delay: .03s; }
.r2 { animation-delay: .08s; }
.r3 { animation-delay: .13s; }
.r4 { animation-delay: .18s; }
.r5 { animation-delay: .23s; }
@keyframes reveal {
  from { opacity: 0; transform: translateY(12px) scale(.98); }
  to { opacity: 1; transform: none; }
}
@media (max-height: 650px) {
  .card { padding-top: 12px; }
  .profile { padding-bottom: 10px; }
  .section-title { margin-bottom: 4px; }
  .list { margin-bottom: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

  <symbol id="home" viewBox="0 0 24 24"><path d="m12 3 9 8h-3v9h-4v-6h-4v6H6v-9H3l9-8Z"/></symbol>

  <symbol id="mail" viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5Z"/></symbol>
  <symbol id="telegram" viewBox="0 0 24 24"><path d="M21.9 4.6 18.8 19c-.2 1-.8 1.2-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-1 .5l.3-4.6L18 6.9c.4-.3-.1-.5-.6-.2L7.2 13.2 2.7 11.8c-1-.3-1-1 .2-1.4l18-7c.8-.3 1.5.2 1 1.2Z"/></symbol>

  <symbol id="money" viewBox="0 0 24 24"><path d="M12 2 2 7v2h20V7L12 2Zm-10 9v8H2v3h20v-3h-2v-8h-4v8h-4v-8H8v8H4v-8H2Z"/></symbol>
  <symbol id="location" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></symbol>

<main class="card">
  <header class="profile reveal r1">
    <div class="avatar">МВ</div>
    <h1>Максим Витков</h1>
    <p class="subtitle"><span class="online"></span>Цифровая визитка · NFC-карта</p>
  </header>

  <p class="section-title reveal r2">Контакт</p>

  <div class="list reveal r2">
    <button class="row" type="button" onclick="downloadVCard()">
      <span class="icon i-contact"><svg><use href="#person"/></svg></span>
      <span class="row-copy">
        <strong>Добавить в контакты</strong>
        <small>Имя, фамилия, телефон, почта</small>
      </span>
      <span class="chevron"></span>
    </button>

    <button class="row" type="button" onclick="openOwnerMap()">
      <span class="icon i-home"><svg><use href="#home"/></svg></span>
      <span class="row-copy">
        <strong>Вернуть карточку владельцу</strong>
        <small>Strada Maria Drăgan 22/1, Chișinău</small>
      </span>
      <span class="chevron"></span>
    </button>
  </div>

  <div class="grid">
    <a class="action reveal r3" href="tel:+37378407287">
      <span class="icon i-phone"><svg><use href="#phone"/></svg></span>
      Позвонить
    </a>

    <a class="action reveal r3" href="mailto:vitm36844@gmail.com">
      <span class="icon i-mail"><svg><use href="#mail"/></svg></span>
      Почта
    </a>

    <a class="action reveal r4" href="https://t.me/Vitk0V" target="_blank" rel="noopener">
      <span class="icon i-telegram"><svg><use href="#telegram"/></svg></span>
      Telegram
    </a>

    <a class="action reveal r4" href="https://wa.me/37378407287" target="_blank" rel="noopener">
      <span class="icon i-whatsapp"><svg><use href="#whatsapp"/></svg></span>
      WhatsApp
    </a>

    <a class="action reveal r5" href="https://mia-qr.bnm.md/1/m/BNM/AGRbcfca880b0184d258a83a8d54f41d606" target="_blank" rel="noopener">
      <span class="icon i-money"><svg><use href="#money"/></svg></span>
      Перевести деньги
    </a>

    <button class="action reveal r5" type="button" onclick="shareFoundLocation()">
      <span class="icon i-location"><svg><use href="#location"/></svg></span>
      Карта найдена<br>здесь
    </button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
function openOwnerMap() {
  const address = 'Strada Maria Drăgan 22/1, Chișinău';
  const destination = encodeURIComponent(address);

  window.location.href =
    `https://www.google.com/maps/dir/?api=1&destination=${destination}`;
}

function downloadVCard() {
  const vcf = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:Vitkov;Maxim;;;',
    'FN:Максим Витков',
    'TEL;TYPE=CELL:+37378407287',
    'EMAIL:vitm36844@gmail.com',
    'END:VCARD'
  ].join('\r\n');

  const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download = 'Maxim-Vitkov.vcf';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  showToast('Файл контакта сохранён — откройте его, чтобы добавить в контакты');
}

function shareFoundLocation() {
  if (!navigator.geolocation) {
    showToast('Геолокация не поддерживается на этом устройстве');
    return;
  }

  showToast('Определяем местоположение…');

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;
      const mapsUrl = `https://www.google.com/maps?q=${latitude},${longitude}`;

      const text =
        'Вашу NFC-карту отсканировали!\n' +
        `Координаты: ${latitude}, ${longitude} ` +
        `(точность ~${Math.round(accuracy)} м)\n` +
        `На карте: ${mapsUrl}\n` +
        `Время: ${new Date().toLocaleString()}`;

      try {
        const response = await fetch(
          'https://formsubmit.co/ajax/23ba987e96aeb96429b2c061ad8e86ef',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              _subject: '📍 NFC-карта найдена!',
              _template: 'table',
              _captcha: 'false',
              message: text
            })
          }
        );

        if (!response.ok) throw new Error();
        showToast('✅ Отправлено! Максим получил местоположение');
      } catch {
        if (navigator.share) {
          navigator.share({
            title: 'Карта найдена здесь',
            text: 'Отправьте это Максиму:',
            url: mapsUrl
          }).catch(() => {});
        } else {
          window.open(mapsUrl, '_blank');
        }
      }
    },
    () => showToast('Не удалось получить геолокацию — проверьте разрешения'),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

let toastTimer;

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 3500);
}
</script>

</body>
