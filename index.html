<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<title>Максим Витков — цифровая визитка</title>
<style>
  /* Системные цвета iOS */
  :root {
    --bg: #f2f2f7;
    --cell: #ffffff;
    --cell-border: rgba(0,0,0,.06);
    --card: rgba(255,255,255,.82);
    --text: #000000;
    --text2: rgba(60,60,67,.6);
    --hairline: rgba(0,0,0,.08);

    --blue: #007aff;
    --green: #34c759;
    --teal: #30b0c7;
    --mint: #00c7be;
    --orange: #ff9500;
    --red: #ff3b30;
    --purple: #af52de;
    --gray: #8e8e93;

    --radius-cell: 16px;
    --shadow-card: 0 1px 3px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --cell: #1c1c1e;
      --cell-border: rgba(255,255,255,.07);
      --card: rgba(28,28,30,.78);
      --text: #ffffff;
      --text2: rgba(235,235,245,.6);
      --hairline: rgba(255,255,255,.09);

      --blue: #0a84ff;
      --green: #30d158;
      --teal: #40cbe0;
      --mint: #63e6e2;
      --orange: #ff9f0a;
      --red: #ff453a;
      --purple: #bf5af2;
      --gray: #8e8e93;

      --shadow-card: 0 1px 3px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 14px;
  }

  /* Карточка — frosted glass */
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--cell-border);
    border-radius: 24px;
    box-shadow: var(--shadow-card);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    padding: 28px 16px 16px;
  }

  /* Монограмма как в Контактах iOS */
  .avatar {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: linear-gradient(180deg, #aeaeb2, #8e8e93);
    border: 3px solid var(--cell);
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 600; letter-spacing: .01em;
    margin: 0 auto 14px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -.02em;
    text-align: center;
    color: var(--text);
  }
  .subtitle {
    text-align: center;
    color: var(--text2);
    font-size: 14px;
    margin: 5px 0 22px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .pulse {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2.4s ease infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: .35; }
  }

  /* Главная кнопка — iOS filled button */
  .btn.primary {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    background: var(--blue);
    border: none;
    border-radius: var(--radius-cell);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    padding: 15px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: filter .15s ease, transform .1s ease;
  }
  .btn.primary:active { filter: brightness(.82); transform: scale(.985); }
  .btn.primary svg { width: 20px; height: 20px; fill: currentColor; }

  /* Плитки — стиль Пункта управления */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    min-height: 118px;
    padding: 14px 6px;
    background: var(--cell);
    border: 1px solid var(--cell-border);
    border-radius: 20px;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -.01em;
    text-decoration: none;
    cursor: pointer;
    text-align: center;
    font-family: inherit;
    transition: filter .15s ease, transform .1s ease;
  }
  .tile:active { filter: brightness(.85); transform: scale(.97); }
  .tile .icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 2px 6px rgba(0,0,0,.12);
  }
  .tile .icon svg { width: 24px; height: 24px; fill: currentColor; }
  .tile span:last-child { line-height: 1.2; }

  /* Ячейка на всю ширину — как в Настройках iOS */
  .btn.wide {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 0;
    background: var(--cell);
    border: 1px solid var(--cell-border);
    border-radius: var(--radius-cell);
    color: var(--text);
    font-size: 17px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    transition: filter .15s ease, transform .1s ease;
  }
  .btn.wide:active { filter: brightness(.85); transform: scale(.985); }
  .btn.wide .icon {
    width: 34px; height: 34px; flex: 0 0 34px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
  }
  .btn.wide .icon svg { width: 19px; height: 19px; fill: currentColor; }
  .btn.wide small { display: block; color: var(--text2); font-size: 13px; margin-top: 1px; font-weight: 400; }
  .btn.wide .chev {
    margin-left: auto;
    color: var(--text2);
    font-size: 22px;
    font-weight: 400;
    line-height: 1;
  }

  /* Цвета иконок — палитра iOS */
  .ic-call    { background: var(--green); }
  .ic-mail    { background: var(--blue); }
  .ic-tg      { background: var(--teal); }
  .ic-wa      { background: var(--mint); }
  .ic-money   { background: var(--orange); }
  .ic-geo     { background: var(--red); }
  .ic-home    { background: var(--purple); }

  /* Toast — iOS-стиль */
  .toast {
    position: fixed; left: 50%; bottom: 28px;
    transform: translateX(-50%) translateY(90px);
    background: rgba(30,30,32,.92);
    color: #fff;
    padding: 12px 18px;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 500;
    opacity: 0;
    transition: all .3s cubic-bezier(.2,.9,.3,1.2);
    pointer-events: none;
    max-width: 88vw; text-align: center;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Плавное появление */
  .fade-up { animation: fadeUp .5s cubic-bezier(.2,.8,.3,1) backwards; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .d1 { animation-delay: .04s; } .d2 { animation-delay: .10s; }
  .d3 { animation-delay: .16s; } .d4 { animation-delay: .22s; }
  .d5 { animation-delay: .28s; } .d6 { animation-delay: .34s; }
  .d7 { animation-delay: .40s; } .d8 { animation-delay: .46s; }

  @media (prefers-reduced-motion: reduce) {
    .fade-up, .pulse { animation: none; }
  }
</style>
<base target="_blank">
</head>
<body>

<div class="card">
  <div class="avatar fade-up d1">МВ</div>
  <h1 class="fade-up d2">Максим Витков</h1>
  <p class="subtitle fade-up d3"><span class="pulse"></span>Цифровая визитка · NFC-карта</p>

  <button class="btn primary fade-up d4" onclick="downloadVCard()">
    <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 12c4.42 0 8 2.24 8 5v3H4v-3c0-2.76 3.58-5 8-5Z"/></svg>
    <span>Добавить в контакты</span>
  </button>

  <div class="grid">
    <a class="tile fade-up d5" href="tel:+37378407287">
      <span class="icon ic-call"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.36 11.36 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.36 11.36 0 0 0 .57 3.57 1 1 0 0 1-.25 1.02Z"/></svg></span>
      <span>Позвонить</span>
    </a>

    <a class="tile fade-up d5" href="mailto:vitm36844@gmail.com">
      <span class="icon ic-mail"><svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5Z"/></svg></span>
      <span>Почта</span>
    </a>

    <a class="tile fade-up d6" href="https://t.me/Vitk0V" target="_blank" rel="noopener">
      <span class="icon ic-tg"><svg viewBox="0 0 24 24"><path d="M21.9 4.6 18.8 19c-.2 1-.8 1.2-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-1 .5l.3-4.6L18 6.9c.4-.3-.1-.5-.6-.2L7.2 13.2 2.7 11.8c-1-.3-1-1 .2-1.4l18-7c.8-.3 1.5.2 1 1.2Z"/></svg></span>
      <span>Telegram</span>
    </a>

    <a class="tile fade-up d6" href="https://wa.me/37378407287" target="_blank" rel="noopener">
      <span class="icon ic-wa"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.4 14.1c-.2.7-1.3 1.3-1.9 1.3-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5.1-4.5-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.4.7-.4h.5c.2 0 .4 0 .6.5s.7 1.8.8 1.9c.1.1.1.3 0 .5l-.4.6c-.2.2-.4.4-.2.8.2.4 1 1.6 2.1 2.6 1.4 1.3 2.6 1.7 3 1.8.4.2.6.1.8-.1l.9-1.1c.2-.3.4-.2.7-.1l1.8.9c.3.1.5.2.5.4 0 0 .1.6-.2 1.3Z"/></svg></span>
      <span>WhatsApp</span>
    </a>

    <a class="tile fade-up d7" href="https://mia-qr.bnm.md/1/m/BNM/AGRbcfca880b0184d258a83a8d54f41d606" target="_blank" rel="noopener">
      <span class="icon ic-money"><svg viewBox="0 0 24 24"><path d="M12 2 2 7v2h20V7Zm-10 9v8H2v3h20v-3h-2v-8Zm4 0h4v4H6Zm6 0h4v8h-4ZM4 13v6h2v-6Zm0 0"/></svg></span>
      <span>Перевести деньги</span>
    </a>

    <button class="tile fade-up d7" onclick="shareFoundLocation()">
      <span class="icon ic-geo"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg></span>
      <span>Карта найдена здесь</span>
    </button>
  </div>

  <a class="btn wide fade-up d8" href="https://www.google.com/maps/search/?api=1&query=Strada+Maria+Dr%C4%83gan+22%2F1%2C+Chi%C8%99in%C4%83u" target="_blank" rel="noopener">
    <span class="icon ic-home"><svg viewBox="0 0 24 24"><path d="m12 3 9 8h-3v9h-4v-6h-4v6H6v-9H3Z"/></svg></span>
    <span>Вернуть карточку владельцу<small>Strada Maria Drăgan 22/1, Chișinău</small></span>
    <span class="chev">›</span>
  </a>
</div>

<div class="toast" id="toast"></div>

<script>
  // ---------- vCard ----------
  function downloadVCard() {
    const vcf = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:Vitkov;Maxim;;;',
      'FN:Максим Витков',
      'TEL;TYPE=CELL:+37378407287',
      'EMAIL:vitm36844@gmail.com',
      'END:VCARD'
    ].join('\r\n');
    const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Maxim-Vitkov.vcf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Файл контакта сохранён — откройте его, чтобы добавить в контакты');
  }

  // ---------- Геолокация: отправка координат на почту ----------
  function shareFoundLocation() {
    if (!navigator.geolocation) {
      showToast('Геолокация не поддерживается на этом устройстве');
      return;
    }
    showToast('Определяем местоположение…');
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        const mapsUrl = 'https://www.google.com/maps?q=' + latitude + ',' + longitude;
        const text = 'Вашу NFC-карту отсканировали!\n' +
                     'Координаты: ' + latitude + ', ' + longitude +
                     ' (точность ~' + Math.round(accuracy) + ' м)\n' +
                     'На карте: ' + mapsUrl + '\n' +
                     'Время: ' + new Date().toLocaleString();
        try {
          const res = await fetch('https://formsubmit.co/ajax/23ba987e96aeb96429b2c061ad8e86ef', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              _subject: '📍 NFC-карта найдена!',
              _template: 'table',
              _captcha: 'false',
              message: text
            })
          });
          if (!res.ok) throw new Error();
          showToast('✅ Отправлено! Максим получил местоположение');
        } catch (e) {
          if (navigator.share) {
            navigator.share({ title: 'Карта найдена здесь', text: 'Отправьте это Максиму:', url: mapsUrl }).catch(() => {});
          } else {
            window.open(mapsUrl, '_blank');
          }
        }
      },
      () => showToast('Не удалось получить геолокацию — проверьте разрешения'),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // ---------- Toast ----------
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
  }
</script>

</body>
</html>
