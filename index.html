<script>
function openOwnerMap(){
 const address='Strada Maria Drăgan 22/1, Chișinău';
 window.location.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(address);
}
function downloadVCard(){
 const vcf=['BEGIN:VCARD','VERSION:3.0','N:Vitkov;Maxim;;;','FN:Максим Витков','TEL;TYPE=CELL:+37378407287','EMAIL:vitm36844@gmail.com','END:VCARD',''].join('\r\n');
 const blob=new Blob([vcf],{type:'text/vcard;charset=utf-8'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');
 a.href=url;a.download='Maxim-Vitkov.vcf';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
 showToast('Откройте файл контакта, чтобы сохранить номер');
}
let locationBusy=false;
function setLocationBusy(busy){locationBusy=busy;const button=document.getElementById('locationButton');button.disabled=busy;button.setAttribute('aria-busy',String(busy));}
function shareFoundLocation(){
 if(locationBusy)return;
 if(!navigator.geolocation){showToast('Геолокация не поддерживается на этом устройстве');return;}
 setLocationBusy(true);showToast('Определяем местоположение…');
 navigator.geolocation.getCurrentPosition(async(pos)=>{
 const{latitude,longitude,accuracy}=pos.coords;
 const mapsUrl=`https://www.google.com/maps?q=${latitude},${longitude}`;
 const text='Вашу NFC-карту отсканировали!\n'+`Координаты: ${latitude}, ${longitude} (точность ~${Math.round(accuracy)} м)\n`+`На карте: ${mapsUrl}\nВремя: ${new Date().toLocaleString('ru-RU')}`;
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
 try{
 const response=await fetch('https://formsubmit.co/ajax/23ba987e96aeb96429b2c061ad8e86ef',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({_subject:'📍 NFC-карта найдена!',_template:'table',_captcha:'false',message:text})});
 if(!response.ok)throw new Error('send');
 const result=await response.json();if(result.success!==true&&result.success!=='true')throw new Error('send');
 showToast('Местоположение отправлено Максиму');
 }catch{
 showToast('Не удалось отправить автоматически. Поделитесь местоположением с Максимом');
 if(navigator.share){try{await navigator.share({title:'Карта найдена здесь',text:'Отправьте это Максиму:',url:mapsUrl});}catch(error){if(error.name!=='AbortError')openLocationFallback(mapsUrl);}}
 else openLocationFallback(mapsUrl);
 }finally{clearTimeout(timeout);setLocationBusy(false);}
 },(error)=>{setLocationBusy(false);showToast(error.code===1?'Разрешите доступ к геолокации в настройках браузера':error.code===3?'Не удалось определить место вовремя. Попробуйте ещё раз':'Не удалось получить геолокацию — проверьте разрешения');},{enableHighAccuracy:true,timeout:10000});
}
function openLocationFallback(url){const opened=window.open(url,'_blank');if(opened)opened.opener=null;else window.location.href=url;}
let toastTimer;
function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),4500);}

function applyTheme(theme){
 document.documentElement.dataset.theme=theme;
 document.querySelector('meta[name="theme-color"]').content=theme==='light'?'#eef0f4':'#080a0e';
 document.getElementById('themeToggle').setAttribute('aria-label',theme==='light'?'Включить тёмную тему':'Включить светлую тему');
}
function toggleTheme(){
 const theme=document.documentElement.dataset.theme==='light'?'dark':'light';
 applyTheme(theme);try{localStorage.setItem('vcard-theme',theme);}catch{}
}
try{applyTheme(localStorage.getItem('vcard-theme')==='light'?'light':'dark');}catch{applyTheme('dark');}
const wallet=document.getElementById('wallet');
if(window.matchMedia('(hover: hover) and (prefers-reduced-motion: no-preference)').matches){
 wallet.addEventListener('pointermove',(event)=>{const r=wallet.getBoundingClientRect();wallet.style.setProperty('--ry',((event.clientX-r.left)/r.width-.5)*8+'deg');wallet.style.setProperty('--rx',(.5-(event.clientY-r.top)/r.height)*8+'deg');});
 wallet.addEventListener('pointerleave',()=>{wallet.style.setProperty('--rx','0deg');wallet.style.setProperty('--ry','0deg');});
}
