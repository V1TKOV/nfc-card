<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Максим Витков — цифровая визитка</title>

<style>
:root {
  --system-background: #f2f2f7;
  --grouped-background: #ffffff;
  --label: #1c1c1e;
  --secondary-label: #6c6c70;
  --separator: rgba(60, 60, 67, .18);
  --blue: #007aff;
  --green: #34c759;
  --orange: #ff9f0a;
  --red: #ff3b30;
  --shadow: 0 18px 50px rgba(0, 0, 0, .10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --system-background: #000000;
    --grouped-background: #1c1c1e;
    --label: #ffffff;
    --secondary-label: #98989d;
    --separator: rgba(255, 255, 255, .15);
    --blue: #0a84ff;
    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;
    --shadow: 0 18px 50px rgba(0, 0, 0, .45);
  }
}
* {
  box-sizing: border-box;
  margin: 0;
  -webkit-tap-highlight-color: transparent;
}
html {
  background: var(--system-background);
}
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding:
    max(22px, env(safe-area-inset-top))
    16px
    max(22px, env(safe-area-inset-bottom));
  color: var(--label);
  background:
    radial-gradient(800px 430px at 50% -100px, rgba(0, 122, 255, .12), transparent 65%),
    var(--system-background);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.card {
  width: min(100%, 430px);
  overflow: hidden;
  border: 1px solid var(--separator);
  border-radius: 30px;
  background: rgba(255, 255, 255, .72);
  box-shadow: var(--shadow);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
}
@media (prefers-color-scheme: dark) {
  .card { background: rgba(28, 28, 30, .82); }
}
.profile {
  padding: 30px 20px 26px;
  text-align: center;
}
.avatar {
  width: 92px;
  height: 92px;
  display: grid;
  place-items: center;
  margin: 0 auto 15px;
  border: 3px solid rgba(255, 255, 255, .92);
  border-radius: 50%;
  color: #fff;
  background: linear-gradient(145deg, #4a4a4f, #1c1c1e);
  box-shadow: 0 8px 18px rgba(0, 0, 0, .20);
  font-size: 31px;
  font-weight: 700;
  letter-spacing: -.08em;
}
h1 {
  font-size: 30px;
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -.045em;
}
.subtitle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  margin-top: 9px;
  color: var(--secondary-label);
  font-size: 14px;
}
.online {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(52, 199, 89, .16);
}
.section-title {
  margin: 0 20px 8px;
  color: var(--secondary-label);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .02em;
  text-transform: uppercase;
}
.list {
  overflow: hidden;
  margin: 0 12px 12px;
  border: 1px solid var(--separator);
  border-radius: 18px;
  background: var(--grouped-background);
}
.row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  min-height: 68px;
  padding: 11px 14px;
  border: 0;
  color: var(--label);
  background: transparent;
  font: inherit;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: background .15s ease, transform .18s cubic-bezier(.2, .8, .2, 1);
}
.row + .row::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  left: 67px;
  height: 1px;
  background: var(--separator);
}
.row:hover {
  background: rgba(120, 120, 128, .08);
}
.row:active {
  transform: scale(.985);
  background: rgba(120, 120, 128, .15);
}
.icon {
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: #fff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
}
.icon svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}
.i-contact { background: var(--blue); }
.i-home { background: #8e8e93; }
.i-phone { background: var(--green); }
.i-mail { background: var(--orange); }
.i-telegram { background: #229ed9; }
.i-whatsapp { background: #25d366; }
.i-money { background: #ff6b37; }
.i-location { background: var(--red); }

.row-copy {
  min-width: 0;
  flex: 1;
}
.row-copy strong {
  display: block;
  font-size: 16px;
  font-weight: 500;
}
.row-copy small {
  display: block;
  overflow: hidden;
  margin-top: 3px;
  color: var(--secondary-label);
  font-size: 12.5px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chevron {
  width: 8px;
  height: 8px;
  margin-right: 4px;
  border-top: 1.5px solid var(--secondary-label);
  border-right: 1.5px solid var(--secondary-label);
  transform: rotate(45deg);
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 12px 12px;
}
.action {
  min-height: 118px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 11px;
  padding: 16px 8px;
  border: 1px solid var(--separator);
  border-radius: 18px;
  color: var(--label);
  background: var(--grouped-background);
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.25;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transition: transform .22s cubic-bezier(.2, .8, .2, 1), box-shadow .22s ease;
}
.action:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(0, 0, 0, .10);
}
.action:active {
  transform: scale(.965);
}
.toast {
  position: fixed;
  z-index: 5;
  bottom: max(24px, env(safe-area-inset-bottom));
  left: 50%;
  max-width: calc(100vw - 32px);
  padding: 12px 16px;
  border: 1px solid rgba(255, 255, 255, .15);
  border-radius: 14px;
  color: #fff;
  background: rgba(28, 28, 30, .94);
  box-shadow: 0 10px 32px rgba(0, 0, 0, .25);
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  opacity: 0;
  transform: translate(-50%, 20px) scale(.96);
  pointer-events: none;
  transition: opacity .28s ease, transform .45s cubic-bezier(.16, 1, .3, 1);
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}
.reveal {
  animation: reveal .65s cubic-bezier(.16, 1, .3, 1) both;
}
.r1 { animation-delay: .03s; }
.r2 { animation-delay: .08s; }
.r3 { animation-delay: .13s; }
.r4 { animation-delay: .18s; }
.r5 { animation-delay: .23s; }
@keyframes reveal {
  from { opacity: 0; transform: translateY(16px) scale(.98); }
  to { opacity: 1; transform: none; }
}
@media (max-width: 370px) {
  body { padding-right: 8px; padding-left: 8px; }
  .card { border-radius: 25px; }
  h1 { font-size: 27px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
<base target="_blank">
</head>

<body>

  <symbol id="money" viewBox="0 0 24 24"><path d="M12 2 2 7v2h20V7L12 2Zm-10 9v8H2v3h20v-3h-2v-8h-4v8h-4v-8H8v8H4v-8H2Z"/></symbol>

<main class="card">
  <header class="profile reveal r1">
    <div class="avatar">МВ</div>
    <h1>Максим Витков</h1>
    <p class="subtitle"><span class="online"></span>Цифровая визитка · NFC-карта</p>
  </header>

  <p class="section-title reveal r2">Контакт</p>

  <div class="list reveal r2">
    <button class="row" onclick="downloadVCard()">
      <span class="icon i-contact"><svg><use href="#person"/></svg></span>

    <a class="row" href="https://www.google.com/maps/search/?api=1&query=Strada+Maria+Dr%C4%83gan+22%2F1%2C+Chi%C8%99in%C4%83u" target="_blank" rel="noopener">

    </a>

    <a class="action reveal r5" href="https://mia-qr.bnm.md/1/m/BNM/AGRbcfca880b0184d258a83a8d54f41d606" target="_blank" rel="noopener">

</main>

<div class="toast" id="toast"></div>

<script>
function downloadVCard() {
  const vcf = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:Vitkov;Maxim;;;',
    'FN:Максим Витков',
    'TEL;TYPE=CELL:+37378407287',
    'EMAIL:vitm36844@gmail.com',
    'END:VCARD'
  ].join('\r\n');

  const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download = 'Maxim-Vitkov.vcf';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  showToast('Файл контакта сохранён — откройте его, чтобы добавить в контакты');
}

function shareFoundLocation() {
  if (!navigator.geolocation) {
    showToast('Геолокация не поддерживается на этом устройстве');
    return;
  }

  showToast('Определяем местоположение…');

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;
      const mapsUrl = 'https://www.google.com/maps?q=' + latitude + ',' + longitude;
      const text =
        'Вашу NFC-карту отсканировали!\n' +
        'Координаты: ' + latitude + ', ' + longitude +
        ' (точность ~' + Math.round(accuracy) + ' м)\n' +
        'На карте: ' + mapsUrl + '\n' +
        'Время: ' + new Date().toLocaleString();

      try {
        const res = await fetch('https://formsubmit.co/ajax/23ba987e96aeb96429b2c061ad8e86ef', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            _subject: '📍 NFC-карта найдена!',
            _template: 'table',
            _captcha: 'false',
            message: text
          })
        });

        if (!res.ok) throw new Error();
        showToast('✅ Отправлено! Максим получил местоположение');
      } catch (e) {
        if (navigator.share) {
          navigator.share({
            title: 'Карта найдена здесь',
            text: 'Отправьте это Максиму:',
            url: mapsUrl
          }).catch(() => {});
        } else {
          window.open(mapsUrl, '_blank');
        }
      }
    },
    () => showToast('Не удалось получить геолокацию — проверьте разрешения'),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

let toastTimer;
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
}
</script>
